<div class="container-fluid mt-5" id="seccion1">
  <h1 class="text-center mb-4">Nuestras Promociones</h1>

  <div id="carouselProductos" class="carousel slide mb-4 carrusel-clinica" data-bs-ride="carousel">
    <div class="carousel-indicators">
      @for (imagen of imagenes; track imagen.src; let i = $index) {
        <button type="button" data-bs-target="#carouselProductos" [attr.data-bs-slide-to]="i"
          [class.active]="i === 0"></button>
      }
    </div>

    <div class="carousel-inner">
      @for (imagen of imagenes; track imagen.src; let i = $index) {
        <div class="carousel-item" [class.active]="i === 0">
          <img [src]="imagen.src" class="d-block w-100" [alt]="imagen.alt">
          <div class="carrusel-overlay">
            <h3>{{ imagen.titulo }}</h3>
            <p>{{ imagen.descripcion }}</p>
          </div>
        </div>
      }
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#carouselProductos" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselProductos" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Siguiente</span>
    </button>
  </div>
</div>
